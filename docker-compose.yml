version: "3.9"

services:
  postgres:
    image: postgres:16
    container_name: booking_postgres_showcase
    restart: always
    environment:
      POSTGRES_DB: booking_db_showcase
      POSTGRES_USER: booking_user_showcase
      POSTGRES_PASSWORD: booking_password_showcase
    volumes:
      - postgres_data_showcase:/var/lib/postgresql/data
    ports:
      - "5433:5432"

  backend:
    build:
      context: ./backend
    container_name: booking_backend_showcase
    command: python manage.py runserver 0.0.0.0:8080
    volumes:
      - ./backend:/app
    ports:
      - "8081:8080"
    environment:
      - DATABASE_URL=postgres://booking_user_showcase:booking_password_showcase@postgres:5432/booking_db_showcase
      - SECRET_KEY=django-insecure-dev-key-for-showcase-only
      - DEBUG=True
    depends_on:
      - postgres

  frontend:
    build:
      context: ./frontend
    container_name: booking_frontend_showcase
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  postgres_data_showcase:
